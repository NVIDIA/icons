name: Bug Report
description: Report a broken package export, incorrect type, build failure, or rendering error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: input
    id: package-version
    attributes:
      label: Package and version
      placeholder: "@nvidia/react-gui-icons@1.0.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Node.js version:
        - React version (if applicable):
        - Bundler (Vite / webpack / etc.):
        - Framework (Next.js / Remix / etc.):
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste any error messages.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a CodeSandbox, StackBlitz, or repository that reproduces the issue.
